<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1d1240" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
  <title>Flash &amp; Furious</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
</head>
<body>
  <main id="view-shoot" class="view active">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <img id="live" class="live mirrored" alt="" hidden />
        <img id="review" class="review" alt="" hidden />
        <img id="frameOverlay" class="frame-overlay" alt="" hidden />
        <span id="lastBadge" class="last-badge" hidden data-i18n="booth.lastPhoto">Last photo</span>
        <p id="liveMsg" class="live-msg" hidden></p>
      </div>
    </div>
    <aside class="controls">
      <div class="side-top">
        <div class="status" id="status"><span class="dot"></span><span id="statusText" data-i18n="status.connecting">Connecting…</span></div>
        <button class="icon-btn" id="fullscreenBtn" title="Full screen" aria-label="Full screen" data-i18n-attr="title:booth.fullscreen;aria-label:booth.fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
      <button id="bwBtn" class="big-btn bw-btn" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
        <span data-i18n="booth.bw">Black &amp; white</span>
      </button>
      <button id="shootBtn" class="shutter" aria-label="Take a photo" data-i18n-attr="aria-label:booth.shoot">
        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      </button>
      <div class="side-bottom">
        <button id="lastThumb" class="last-thumb" aria-label="Last photo" data-i18n-attr="aria-label:booth.lastPhoto" hidden><img alt="" /></button>
        <button id="galleryBtn" class="big-btn gallery-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg>
          <span><span data-i18n="booth.gallery">Gallery</span> <span id="count" class="badge"></span></span>
        </button>
      </div>
    </aside>
  </main>

  <main id="view-gallery" class="view">
    <div class="gallery-head">
      <button id="backBtn" class="big-btn back-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span data-i18n="booth.back">Back</span>
      </button>
      <h2 data-i18n="booth.gallery">Gallery</h2>
    </div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden data-i18n="booth.empty">No photos yet.</p>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div id="countdown" class="countdown"></div>
    <div id="overlayText" class="overlay-text"></div>
    <div id="overlayHint" class="overlay-hint" hidden></div>
  </div>
  <div id="flash" class="flash"></div>

  <div id="viewer" class="viewer" hidden>
    <button class="icon-btn close" id="viewerClose" aria-label="Close" data-i18n-attr="aria-label:booth.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="nav prev" id="viewerPrev" aria-label="Previous" data-i18n-attr="aria-label:booth.previous">‹</button>
    <img id="viewerImg" alt="" />
    <button class="nav next" id="viewerNext" aria-label="Next" data-i18n-attr="aria-label:booth.next">›</button>
    <div class="viewer-bar"><span id="viewerInfo"></span></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
