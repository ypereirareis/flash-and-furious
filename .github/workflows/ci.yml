# Quality checks on every pull request (all required to merge into main).
# Nothing is published: the Docker image is only built to be tested and scanned, then thrown away.
# The app itself is still built and run locally.
# Only official GitHub actions are allowed, pinned to a full commit SHA; tools run from Docker
# images pinned to a digest.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # every Monday: new vulnerabilities appear without any code change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HADOLINT_IMAGE: hadolint/hadolint@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27 # v2.15.1-debian
  TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb # 0.76.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: find server public scripts tests features -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Translations
        run: node scripts/check-i18n.js
      - name: Shell scripts (ShellCheck)
        run: shellcheck scripts/*.sh docker/*.sh .githooks/commit-msg tests/fake-camera/gphoto2
      - name: Dockerfile (hadolint)
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint - < Dockerfile

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # in the app image (same Node, sharp and libvips as in production); the functional tests
      # take a few minutes and are run by hand: ./scripts/test.sh functional [--real]
      - name: Unit tests
        run: ./scripts/test.sh unit

  smoke:
    name: Docker build & smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t flash-and-furious:ci .
      - name: Start the app (without a camera)
        run: |
          mkdir -p "$RUNNER_TEMP/photos"
          docker run -d --name app -p 3000:3000 -e DEFAULT_LANG=en \
            -e PUID="$(id -u)" -e PGID="$(id -g)" -v "$RUNNER_TEMP/photos:/app/photos" flash-and-furious:ci
      - name: Smoke test
        run: ./scripts/smoke-test.sh http://localhost:3000
      - name: Photos folder prepared by the entrypoint
        run: test -d "$RUNNER_TEMP/photos/originals" && test -d "$RUNNER_TEMP/photos/.cache"
      - name: Storage problems block photos (no photos folder mounted)
        run: |
          docker run -d --name nostorage -p 3001:3000 -e DEFAULT_LANG=en flash-and-furious:ci
          for _ in $(seq 1 30); do curl -fsS localhost:3001/api/status >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:3001/api/status | grep -F 'Photo storage'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/api/shoot)" = 503
      - name: App logs
        if: always()
        run: docker logs app; docker logs nostorage || true

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t flash-and-furious:ci .
      - name: Scan the image (fails on fixable HIGH / CRITICAL vulnerabilities)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          flash-and-furious:ci
